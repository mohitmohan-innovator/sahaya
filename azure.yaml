# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: sahaya
metadata:
  template: sahaya@1.0.0

# Infrastructure-only template: azd provisions the Azure resources; the
# Python agents and the Officer Console run locally from this repo.
infra:
  provider: bicep
  path: infra

hooks:
  # Runs after `azd provision` / `azd up`. Fetches the two keys SAHAYA still
  # uses (Search admin key, Foundry models key) with az CLI and writes a local,
  # gitignored .env. No key is ever stored in Bicep outputs or azd state.
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: false
      continueOnError: false